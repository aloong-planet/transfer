# Dependabot version updates for the actions used by .github/workflows/.
# The workflows pin each action as `owner/repo@<full commit SHA> # vX.Y.Z`. Dependabot's pull requests update the
# commit and the version comment on the same line together, so the pins keep that form.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # For GitHub Actions the documented value is "/": Dependabot then reads .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
    # A release is proposed only once it is 7 days old, so a broken or compromised release has time to be withdrawn
    # first. GitHub's default is 3 days; 7 is zizmor's recommended minimum.
    cooldown:
      default-days: 7
    # At the default limit of 5 open pull requests Dependabot stops opening more and reports an error. 10 leaves room
    # for a major update of every action the workflows use, each in its own pull request, plus the grouped one.
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates of every action come in one pull request. Each major update still comes in its own,
      # since a major release may contain breaking changes.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
