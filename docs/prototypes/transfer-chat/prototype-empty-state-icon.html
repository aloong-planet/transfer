<!doctype html>
<!-- Review notes: prototype-empty-state-icon.md -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>聊天空状态图标</title>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language mode"></script>
<link rel="stylesheet" href="../_shared/palette.css">
<style>
 /* The two panes below are fixed light and fixed dark, side by side: they never follow the mode.
    Only the page chrome around them follows it (data-demo-mode on the root). */
 html[data-demo-mode="light"]{--pg-bg:#eceef1;--pg-ink:#1a1c1f;--pg-muted:#6d727a}
 html[data-demo-mode="dark"]{--pg-bg:#17181a;--pg-ink:#e9eaed;--pg-muted:#9aa0a6}
 body{background:var(--pg-bg);color:var(--pg-ink);margin:0;padding:22px;
   font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
 h2{font-size:14px;margin:0 0 4px}
 p.note{color:var(--pg-muted);font-size:12px;margin:0 0 12px;max-width:760px}
 .shell{background:var(--card);border:1px solid var(--line);border-radius:10px;
   width:290px;height:146px;display:flex;overflow:hidden}
 .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
   color:var(--muted);gap:8px;font-size:13px}
 .empty p{margin:16px 0}
 .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
 .col{display:flex;flex-direction:column;gap:6px}
 .tag{font-size:11px;color:var(--pg-muted)}
</style>
</head>
<body>

<h2>聊天空状态图标</h2>
<p class="note">没有发现设备时画雷达,发现设备后画气泡,尺寸 40px;图标与文案走同一个「有没有发现设备」条件。左两栏浅色、右两栏深色,各自固定明暗。</p>
<div class="row"><div class="col" data-palette-mode="light"><span class="tag">浅色 · 搜索中</span><div class="shell"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" /> <path d="M4 6h.01" /> <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" /> <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" /> <path d="M12 18h.01" /> <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" /> <circle cx="12" cy="12" r="2" /> <path d="m13.41 10.59 5.66-5.66" /></svg><p data-t="searching">正在搜索局域网设备…</p></div></div></div><div class="col" data-palette-mode="light"><span class="tag">浅色 · 有设备</span><div class="shell"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg><p data-t="pick">选择左侧设备开始聊天</p></div></div></div><div class="col" data-palette-mode="dark"><span class="tag">深色 · 搜索中</span><div class="shell"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" /> <path d="M4 6h.01" /> <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" /> <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" /> <path d="M12 18h.01" /> <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" /> <circle cx="12" cy="12" r="2" /> <path d="m13.41 10.59 5.66-5.66" /></svg><p data-t="searching">正在搜索局域网设备…</p></div></div></div><div class="col" data-palette-mode="dark"><span class="tag">深色 · 有设备</span><div class="shell"><div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg><p data-t="pick">选择左侧设备开始聊天</p></div></div></div></div>
<script>
  // The two empty-state lines are the product's copy; the language comes from the gallery's settings
  const COPY = {
    zh: { pick: '选择左侧设备开始聊天', searching: '正在搜索局域网设备…' },
    en: { pick: 'Select a device on the left to start chatting', searching: 'Searching for devices on the LAN…' }
  }
  DemoDimensions.on('language', (lang) => {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en'
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = COPY[lang][el.dataset.t]
  })
</script>
</body>
</html>
