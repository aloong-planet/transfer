<!doctype html>
<!-- Review notes: prototype-main-window.md -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>原型 — 主界面(双栏)</title>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language mode"></script>
<script src="../_shared/copy.js"></script>
<link rel="stylesheet" href="../_shared/palette.css">
<style>
  /* The base colours come from the shared palette; this token is only this page's (the online dot) */
  html[data-demo-mode="light"]{ --ok:#3fb950; }
  html[data-demo-mode="dark"]{ --ok:#3fb950; }
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;font-size:13px;display:flex}

  .side{width:230px;border-right:1px solid var(--line);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:2px}
  .side h1{font-size:14px;margin:4px 4px 12px;display:flex;align-items:center}
  .gear{margin-left:auto;color:var(--ink-2);cursor:pointer}.gear:hover{color:var(--accent)}
  .dev{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer}
  .dev:hover{background:var(--bg)}
  .dev.on{background:var(--accent-soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--line-strong)}
  .sub{font-size:11px;color:var(--ink-2)}
  .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:16px}

  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .c-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);font-weight:600}
  .flow{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px}
  .bub{max-width:52%;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);line-height:1.5}
  .bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
  .file{display:flex;align-items:center;gap:10px}
  .fic{width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .fbtns{display:flex;gap:8px;margin-top:8px}
  /* display:flex above outranks the UA's [hidden] rule, so hidden needs its own */
  .fbtns[hidden]{display:none}
  .sm{font-size:12px;padding:4px 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);cursor:pointer}
  .sm.p{background:var(--accent);border-color:var(--accent);color:#fff}.sm.p:hover{background:var(--accent-hover)}
  .img{width:180px;height:110px;border-radius:8px;background:linear-gradient(135deg,var(--accent-soft),var(--line));
    display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .time{align-self:center;font-size:11px;color:var(--ink-2)}
  .inp{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
  .inp input{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px;background:var(--bg);color:var(--ink);outline:none}
  .inp input:focus{border-color:var(--accent)}
  .ico{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-2);cursor:pointer;flex:none}
  .ico:hover{background:var(--accent-soft);color:var(--accent)}
  .send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
  .send:hover{background:var(--accent-hover)}
</style>
</head>
<body>
  <div class="side">
    <h1>Transfer<span class="gear" data-t-title="settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span></h1>
    <div class="dev on" onclick="pick(this,0)"><span class="dot"></span><span><span data-t="deviceLiving"></span><div class="sub">MacBook Pro · 192.168.3.24</div></span><span class="badge" id="badge">2</span></div>
    <div class="dev" onclick="pick(this,1)"><span class="dot"></span><span><span data-t="deviceWork"></span><div class="sub" data-t="deviceWorkSub"></div></span></div>
    <div class="dev" onclick="pick(this,2)"><span class="dot off"></span><span><span data-t="deviceOld"></span><div class="sub" data-t="d2sub">离线 · 保留中</div></span></div>
  </div>
  <div class="chat">
    <div class="c-h"><span class="dot" id="hdot"></span><span id="hname"></span></div>
    <div class="flow">
      <div class="time">14:02</div>
      <div class="bub" data-t="msgContract"></div>
      <div class="bub file"><span class="fic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></svg></span><span><span data-t="fileContract"></span><div class="sub" id="fsub"></div><span class="fbtns" id="fb"><button class="sm p" onclick="acc()" data-t="accept">接收</button><button class="sm" onclick="rej()" data-t="reject">拒绝</button></span></span></div>
      <div class="bub me" data-t="msgGotIt"></div>
      <div class="bub me img"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg> <span data-t="shot">截图预览</span></div>
      <div class="time">14:05</div>
      <div class="bub" data-t="m3">图里第二段要改一下</div>
    </div>
    <div class="inp">
      <span class="ico" title="截图" data-t-title="capture"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span><span class="ico" title="发送文件" data-t-title="sendFile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.234 20.252 21 12.3"/><path d="m16 6-8.414 8.586a2 2 0 0 0 0 2.828 2 2 0 0 0 2.828 0l8.414-8.586a4 4 0 0 0 0-5.656 4 4 0 0 0-5.656 0l-8.415 8.585a6 6 0 1 0 8.486 8.486l7.766-7.952"/></svg></span>
      <input data-t-placeholder="composerPlaceholder">
      <button class="send" data-t="send">发送</button>
    </div>
  </div>
<script>
  // The page's product copy, on top of the copy shared across the pages; the language comes from the
  // gallery's settings
  const SHARED = window.PROTOTYPE_COPY
  const COPY = {
    zh: { ...SHARED.zh, d2sub: '离线 · 保留中',
          accept: '接收', reject: '拒绝',
          openFolder: '打开所在文件夹', shot: '截图预览', m3: '图里第二段要改一下',
          capture: '截图', sendFile: '发送文件', send: '发送',
          fsub: { pending: '2.1 MB · 等待确认', accepted: `2.1 MB · ${SHARED.zh.received}`, rejected: '2.1 MB · 已拒绝' } },
    en: { ...SHARED.en, d2sub: 'Offline · Kept',
          accept: 'Accept', reject: 'Decline',
          openFolder: 'Show in Folder', shot: 'Screenshot preview', m3: 'The second paragraph in the image needs a change',
          capture: 'Screenshot', sendFile: 'Send Files', send: 'Send',
          fsub: { pending: '2.1 MB · Awaiting confirmation', accepted: `2.1 MB · ${SHARED.en.received}`, rejected: '2.1 MB · Declined' } }
  }
  const DEVICES = ['deviceLiving', 'deviceWork', 'deviceOld']
  let lang = 'zh', sel = 0, file = 'pending'  // the language in effect, the selected device, the file's state

  function render(){
    const c = COPY[lang]
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en'
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = c[el.dataset.t]
    for (const el of document.querySelectorAll('[data-t-title]')) el.title = c[el.dataset.tTitle]
    for (const el of document.querySelectorAll('[data-t-placeholder]')) el.placeholder = c[el.dataset.tPlaceholder]
    document.getElementById('hname').textContent = c[DEVICES[sel]]
    document.getElementById('fsub').textContent = c.fsub[file]
    const fb = document.getElementById('fb')
    if (file === 'pending') {
      fb.hidden = false
      fb.innerHTML = '<button class="sm p" onclick="acc()">' + c.accept + '</button><button class="sm" onclick="rej()">' + c.reject + '</button>'
    } else if (file === 'accepted') {
      fb.hidden = false
      fb.innerHTML = '<button class="sm">' + c.openFolder + '</button>'
    } else {
      fb.hidden = true
    }
  }
  function pick(el, idx){
    document.querySelectorAll('.dev').forEach(d=>d.classList.remove('on'));
    el.classList.add('on');
    const b = el.querySelector('.badge'); if(b) b.remove();          // 进入会话未读清零
    sel = idx;
    document.getElementById('hdot').className = el.querySelector('.dot').className;
    render();
  }
  function acc(){ file = 'accepted'; render() }
  function rej(){ file = 'rejected'; render() }

  DemoDimensions.on('language', (v) => { lang = v; render() })
</script>
</body>
</html>
